# Phase M1: ONE manual, founder-approved Meta Voice Transcribe test on SYNTHETIC audio.
#
# Safety properties (each is asserted by spike/rest/tests/workflow.test.ts):
#   * workflow_dispatch only: never push, pull_request, schedule or merge triggers;
#   * runs only from main, so a modified copy of this file on another branch can never read the secret;
#   * needs the protected GitHub environment `meta-spike` (required reviewer, main-only deployment branches). Those
#     protections are configured in GitHub and must be verified there independently BEFORE this file is merged: this
#     workflow cannot check them itself. See spike/rest/README.md for the setup;
#   * the key is read ONLY from the environment secret META_SPIKE_ENV_API_KEY, a name that is deliberately different from
#     the repository-level META_API_KEY. If that environment (or secret) does not exist, the value is empty and the job
#     refuses before any request: it can never fall back to the repository-level secret. This is a second layer, not a
#     substitute for the reviewer and branch rules;
#   * the typed approval phrase below must match, in addition to the environment approval;
#   * read-only repository permissions; one run at a time; 10 minute timeout;
#   * the key is exposed to exactly ONE step, as an environment variable, and is never echoed;
#   * the audio is generated inside the job from the checked-in script and never uploaded; there are NO artifact uploads;
#     only a sanitized scorecard (numbers and fixed codes, no transcript text) goes to the job summary;
#   * actions are pinned to full commit SHAs and no third-party dependencies are installed.
name: Meta REST spike (manual, protected)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type I_HAVE_APPROVAL to confirm the founder authorized exactly one live call"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meta-rest-spike
  cancel-in-progress: false

jobs:
  one-shot:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'I_HAVE_APPROVAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: meta-spike
    steps:
      - name: Check out the repository (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node (type stripping needs 22.18 or newer)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.22.0"

      - name: Install the local synthesizer (ffmpeg with flite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -filters | grep -q flite

      - name: Generate the synthetic two-voice WAV (offline, never uploaded)
        run: node spike/rest/cli.ts generate

      - name: Validate the audio and print the redacted request (offline, sends nothing)
        run: |
          node spike/rest/cli.ts check --wav spike-output/rest-synthetic.wav
          node spike/rest/cli.ts plan --wav spike-output/rest-synthetic.wav

      - name: ONE live transcription request
        env:
          # Environment secret only. The CLI reads the value from META_API_KEY, which is just the variable name it expects.
          META_API_KEY: ${{ secrets.META_SPIKE_ENV_API_KEY }}
          SPIKE_ALLOW_LIVE: I_HAVE_APPROVAL
        run: |
          if [ -z "${META_API_KEY}" ]; then
            echo "Refusing: the meta-spike environment secret META_SPIKE_ENV_API_KEY is missing or empty. No request was made."
            exit 1
          fi
          node spike/rest/cli.ts run --wav spike-output/rest-synthetic.wav --timings spike-output/rest-synthetic.timings.json --live --confirm-one-call

      - name: Publish the sanitized scorecard to the job summary
        if: always()
        run: |
          if [ -f spike-output/rest-scorecard.json ]; then
            { echo '### Meta REST spike scorecard (sanitized: no audio, no transcript text)'; echo '```json'; cat spike-output/rest-scorecard.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No scorecard was produced (the run was refused before the request).' >> "$GITHUB_STEP_SUMMARY"
          fi
